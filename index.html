<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鞋码转换器 - 全球尺码换算工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        
        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        select,
        input {
            width: 100%;
            padding: 0.85rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
            background: #fafafa;
        }
        
        select:focus,
        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.8rem;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #result {
            margin-top: 1.5rem;
            padding: 1.2rem;
            background: #f8f9ff;
            border-radius: 12px;
            font-size: 1rem;
            color: #333;
            min-height: 60px;
            border: 2px dashed #e0e0e0;
            display: none;
            text-align: left;
            line-height: 1.8;
        }
        
        #result.show {
            display: block;
        }
        
        #result.error {
            border-color: #ffcccc;
            background: #fff5f5;
            color: #cc0000;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #eee;
        }
        
        .result-item:last-child {
            border-bottom: none;
        }
        
        .result-label {
            font-weight: 600;
            color: #555;
        }
        
        .result-value {
            font-weight: 700;
            color: #667eea;
            font-size: 1.1rem;
        }
        
        .note {
            margin-top: 1.5rem;
            padding: 0.8rem;
            background: #fffbe6;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #856404;
            text-align: left;
            display: none;
        }
        
        .note.show {
            display: block;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👟 鞋码转换器</h1>
        <p class="subtitle">轻松换算全球不同标准的鞋码</p>
        
        <div class="input-group">
            <label for="sizeSystem">📌 选择你要输入的尺码标准：</label>
            <select id="sizeSystem">
                <option value="cn">中国码 (CN)</option>
                <option value="eu">欧洲码 (EU)</option>
                <option value="us">美国码 (US)</option>
                <option value="uk">英国码 (UK)</option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="inputSize">✏️ 输入鞋码：</label>
            <input type="number" id="inputSize" placeholder="例如：40" step="0.5" min="1" max="50">
        </div>
        
        <button onclick="convertSize()">🔄 转换鞋码</button>
        
        <div id="result">
            <div style="font-weight: 600; margin-bottom: 8px; text-align: center;">✅ 转换结果</div>
            <div class="result-item">
                <span class="result-label">🇨🇳 中国码 (CN)</span>
                <span class="result-value" id="resCn">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">🇪🇺 欧洲码 (EU)</span>
                <span class="result-value" id="resEu">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">🇺🇸 美国码 (US)</span>
                <span class="result-value" id="resUs">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">🇬🇧 英国码 (UK)</span>
                <span class="result-value" id="resUk">-</span>
            </div>
        </div>
        
        <div class="note" id="note">
            💡 提示：当前输入的尺码不在标准对照表中，已使用近似公式估算，仅供参考。
        </div>
    </div>
    
    <script>
        /**
         * 鞋码转换器 - 完整版
         * 基于国际标准尺码对照表（成人女鞋/中性鞋）
         * 覆盖范围：CN 34-46，EU 34-46，US 4-11，UK 2-9
         */
        
        function convertSize() {
            const system = document.getElementById('sizeSystem').value;
            const size = parseFloat(document.getElementById('inputSize').value);
            const resultDiv = document.getElementById('result');
            const noteDiv = document.getElementById('note');
            
            // 清空之前的结果
            resultDiv.classList.remove('error');
            noteDiv.classList.remove('show');
            
            // 验证输入
            if (isNaN(size) || size <= 0) {
                resultDiv.innerHTML = '<span style="color: red;">⚠️ 请输入有效的数字鞋码（大于0）</span>';
                resultDiv.classList.add('show', 'error');
                return;
            }
            
            if (size > 50) {
                resultDiv.innerHTML = '<span style="color: red;">⚠️ 请输入合理的鞋码（不超过50）</span>';
                resultDiv.classList.add('show', 'error');
                return;
            }
            
            // ========== 标准尺码对照表 ==========
            // 格式：[中国码, 欧洲码, 美国码, 英国码]
            const sizeChart = [
                [34, 34, 4,   2],
                [35, 35, 4.5, 2.5],
                [36, 36, 5,   3],
                [37, 37, 5.5, 3.5],
                [38, 38, 6.5, 4.5],
                [39, 39, 7,   5],
                [40, 40, 7.5, 5.5],
                [41, 41, 8,   6],
                [42, 42, 8.5, 6.5],
                [43, 43, 9,   7],
                [44, 44, 9.5, 7.5],
                [45, 45, 10,  8],
                [46, 46, 11,  9]
            ];
            
            // 查找精确匹配
            let matchedRow = null;
            let exactMatch = false;
            
            for (let i = 0; i < sizeChart.length; i++) {
                const row = sizeChart[i];
                let idx = -1;
                
                if (system === 'cn') idx = 0;
                else if (system === 'eu') idx = 1;
                else if (system === 'us') idx = 2;
                else if (system === 'uk') idx = 3;
                
                if (row[idx] === size) {
                    matchedRow = row;
                    exactMatch = true;
                    break;
                }
            }
            
            // 如果没有精确匹配，使用近似公式估算
            if (!exactMatch) {
                let estimated = [0, 0, 0, 0];
                
                if (system === 'cn') {
                    estimated[0] = size;
                    estimated[1] = Math.round(size);
                    estimated[2] = Math.round(size * 0.625 - 17.5);
                    estimated[3] = Math.round(size * 0.5625 - 19.125);
                } else if (system === 'eu') {
                    estimated[0] = Math.round(size);
                    estimated[1] = size;
                    estimated[2] = Math.round(size * 0.65 - 21.05);
                    estimated[3] = Math.round(size * 0.5875 - 22.575);
                } else if (system === 'us') {
                    estimated[0] = Math.round((size + 28) / 0.875);
                    estimated[1] = Math.round((size + 31) / 0.8125);
                    estimated[2] = size;
                    estimated[3] = Math.round(size * 0.925 - 0.075);
                } else if (system === 'uk') {
                    estimated[0] = Math.round((size + 26) / 0.9375);
                    estimated[1] = Math.round((size + 27) / 0.84375);
                    estimated[2] = Math.round(size * 1.081 + 0.189);
                    estimated[3] = size;
                }
                
                // 防止负数
                for (let j = 0; j < 4; j++) {
                    if (estimated[j] < 0) estimated[j] = 'N/A';
                }
                
                matchedRow = estimated;
                noteDiv.classList.add('show');
            }
            
            // 显示结果
            document.getElementById('resCn').textContent = matchedRow[0];
            document.getElementById('resEu').textContent = matchedRow[1];
            document.getElementById('resUs').textContent = matchedRow[2];
            document.getElementById('resUk').textContent = matchedRow[3];
            
            resultDiv.classList.add('show');
            resultDiv.classList.remove('error');
        }
        
        // 支持回车键触发转换
        document.getElementById('inputSize').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                convertSize();
            }
        });
    </script>
</body>
</html>
