<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Size Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 460px;
            width: 100%;
        }
        .lang-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }
        .lang-btn {
            background: #f0f0f0;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .lang-btn:hover {
            background: #667eea;
            color: white;
        }
        .lang-btn.active {
            background: #667eea;
            color: white;
        }
        h1 {
            color: #333;
            margin-bottom: 0.3rem;
            font-size: 1.6rem;
        }
        .subtitle {
            color: #888;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
        }
        select, input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            background: #fafafa;
            transition: border-color 0.3s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        #result {
            margin-top: 1.2rem;
            padding: 1rem;
            background: #f8f9ff;
            border-radius: 12px;
            font-size: 0.95rem;
            color: #333;
            min-height: 160px;
            border: 2px dashed #e0e0e0;
            display: none;
            text-align: left;
            line-height: 1.8;
        }
        #result.show {
            display: block;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #eee;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-label {
            font-weight: 600;
            color: #555;
        }
        .result-value {
            font-weight: 700;
            color: #667eea;
            font-size: 1rem;
        }
        .note {
            margin-top: 1rem;
            padding: 0.6rem;
            background: #fffbe6;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #856404;
            text-align: left;
            display: none;
        }
        .note.show {
            display: block;
        }
        @media (max-width: 480px) {
            .container {
                padding: 1.2rem;
            }
            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="lang-bar">
        <button class="lang-btn active" data-lang="en">🇬🇧 English</button>
        <button class="lang-btn" data-lang="zh">🇨🇳 中文</button>
        <button class="lang-btn" data-lang="de">🇩🇪 Deutsch</button>
        <button class="lang-btn" data-lang="fr">🇫🇷 Français</button>
        <button class="lang-btn" data-lang="it">🇮🇹 Italiano</button>
        <button class="lang-btn" data-lang="es">🇪🇸 Español</button>
    </div>

    <h1 id="title">👟 Shoe Size Converter</h1>
    <p class="subtitle" id="subtitle">Easily convert shoe sizes across different standards</p>

    <div class="input-group">
        <label id="labelStandard">📌 Select your size standard:</label>
        <select id="sizeSystem">
            <option value="cn" id="optCn">China (CN)</option>
            <option value="eu" id="optEu">Europe (EU)</option>
            <option value="us" id="optUs">USA (US)</option>
            <option value="uk" id="optUk">United Kingdom (UK)</option>
        </select>
    </div>

    <div class="input-group">
        <label id="labelInput">✏️ Enter shoe size:</label>
        <input type="number" id="inputSize" placeholder="e.g. 40" step="0.5" min="1" max="50">
    </div>

    <button onclick="convertSize()" id="btnConvert">🔄 Convert Size</button>

    <div id="result">
        <div style="font-weight:600;margin-bottom:8px;text-align:center;" id="resultTitle">✅ Conversion Result</div>
        <div class="result-item"><span class="result-label" id="resLabelCn">🇨🇳 China (CN)</span><span class="result-value" id="resCn">-</span></div>
        <div class="result-item"><span class="result-label" id="resLabelEu">🇪🇺 Europe (EU)</span><span class="result-value" id="resEu">-</span></div>
        <div class="result-item"><span class="result-label" id="resLabelUs">🇺🇸 USA (US)</span><span class="result-value" id="resUs">-</span></div>
        <div class="result-item"><span class="result-label" id="resLabelUk">🇬🇧 United Kingdom (UK)</span><span class="result-value" id="resUk">-</span></div>
    </div>

    <div class="note" id="note">💡 <span id="noteText">The entered size is not in the standard table. Approximate estimation used.</span></div>
</div>

<script>
    const translations = {
        en: {
            title: "👟 Shoe Size Converter",
            subtitle: "Easily convert shoe sizes across different standards",
            labelStandard: "📌 Select your size standard:",
            optCn: "China (CN)",
            optEu: "Europe (EU)",
            optUs: "USA (US)",
            optUk: "United Kingdom (UK)",
            labelInput: "✏️ Enter shoe size:",
            btnConvert: "🔄 Convert Size",
            resultTitle: "✅ Conversion Result",
            resLabelCn: "🇨🇳 China (CN)",
            resLabelEu: "🇪🇺 Europe (EU)",
            resLabelUs: "🇺🇸 USA (US)",
            resLabelUk: "🇬🇧 United Kingdom (UK)",
            errorEmpty: "⚠️ Please enter a valid shoe size (greater than 0).",
            errorLarge: "⚠️ Please enter a reasonable shoe size (not exceeding 50).",
            noteText: "The entered size is not in the standard table. Approximate estimation used."
        },
        zh: {
            title: "👟 鞋码转换器",
            subtitle: "轻松换算全球不同标准的鞋码",
            labelStandard: "📌 选择尺码标准：",
            optCn: "中国码 (CN)",
            optEu: "欧洲码 (EU)",
            optUs: "美国码 (US)",
            optUk: "英国码 (UK)",
            labelInput: "✏️ 输入鞋码：",
            btnConvert: "🔄 转换鞋码",
            resultTitle: "✅ 转换结果",
            resLabelCn: "🇨🇳 中国码 (CN)",
            resLabelEu: "🇪🇺 欧洲码 (EU)",
            resLabelUs: "🇺🇸 美国码 (US)",
            resLabelUk: "🇬🇧 英国码 (UK)",
            errorEmpty: "⚠️ 请输入有效的数字鞋码（大于0）",
            errorLarge: "⚠️ 请输入合理的鞋码（不超过50）",
            noteText: "当前输入的尺码不在标准对照表中，已使用近似公式估算，仅供参考。"
        },
        de: {
            title: "👟 Schuhgrößen-Umrechner",
            subtitle: "Konvertieren Sie Schuhgrößen zwischen verschiedenen Standards",
            labelStandard: "📌 Wählen Sie Ihren Größenstandard:",
            optCn: "China (CN)",
            optEu: "Europa (EU)",
            optUs: "USA (US)",
            optUk: "Vereinigtes Königreich (UK)",
            labelInput: "✏️ Geben Sie die Schuhgröße ein:",
            btnConvert: "🔄 Umrechnen",
            resultTitle: "✅ Umrechnungsergebnis",
            resLabelCn: "🇨🇳 China (CN)",
            resLabelEu: "🇪🇺 Europa (EU)",
            resLabelUs: "🇺🇸 USA (US)",
            resLabelUk: "🇬🇧 Vereinigtes Königreich (UK)",
            errorEmpty: "⚠️ Bitte geben Sie eine gültige Schuhgröße ein (größer als 0).",
            errorLarge: "⚠️ Bitte geben Sie eine angemessene Schuhgröße ein (nicht größer als 50).",
            noteText: "Die eingegebene Größe ist nicht in der Standardtabelle enthalten. Es wurde eine Näherung verwendet."
        },
        fr: {
            title: "👟 Convertisseur de pointures",
            subtitle: "Convertissez facilement les pointures entre différents standards",
            labelStandard: "📌 Sélectionnez votre standard :",
            optCn: "Chine (CN)",
            optEu: "Europe (EU)",
            optUs: "États-Unis (US)",
            optUk: "Royaume-Uni (UK)",
            labelInput: "✏️ Entrez la pointure :",
            btnConvert: "🔄 Convertir",
            resultTitle: "✅ Résultat de la conversion",
            resLabelCn: "🇨🇳 Chine (CN)",
            resLabelEu: "🇪🇺 Europe (EU)",
            resLabelUs: "🇺🇸 États-Unis (US)",
            resLabelUk: "🇬🇧 Royaume-Uni (UK)",
            errorEmpty: "⚠️ Veuillez entrer une pointure valide (supérieure à 0).",
            errorLarge: "⚠️ Veuillez entrer une pointure raisonnable (ne dépassant pas 50).",
            noteText: "La pointure saisie ne figure pas dans le tableau standard. Une estimation approximative a été utilisée."
        },
        it: {
            title: "👟 Convertitore di taglie scarpe",
            subtitle: "Converti facilmente le taglie tra diversi standard",
            labelStandard: "📌 Seleziona il tuo standard:",
            optCn: "Cina (CN)",
            optEu: "Europa (EU)",
            optUs: "Stati Uniti (US)",
            optUk: "Regno Unito (UK)",
            labelInput: "✏️ Inserisci la taglia:",
            btnConvert: "🔄 Converti",
            resultTitle: "✅ Risultato conversione",
            resLabelCn: "🇨🇳 Cina (CN)",
            resLabelEu: "🇪🇺 Europa (EU)",
            resLabelUs: "🇺🇸 Stati Uniti (US)",
            resLabelUk: "🇬🇧 Regno Unito (UK)",
            errorEmpty: "⚠️ Inserisci una taglia valida (maggiore di 0).",
            errorLarge: "⚠️ Inserisci una taglia ragionevole (non superiore a 50).",
            noteText: "La taglia inserita non è nella tabella standard. È stata utilizzata una stima approssimativa."
        },
        es: {
            title: "👟 Conversor de tallas de zapatos",
            subtitle: "Convierte fácilmente tallas entre diferentes estándares",
            labelStandard: "📌 Selecciona tu estándar:",
            optCn: "China (CN)",
            optEu: "Europa (EU)",
            optUs: "EE.UU. (US)",
            optUk: "Reino Unido (UK)",
            labelInput: "✏️ Ingresa la talla:",
            btnConvert: "🔄 Convertir",
            resultTitle: "✅ Resultado de la conversión",
            resLabelCn: "🇨🇳 China (CN)",
            resLabelEu: "🇪🇺 Europa (EU)",
            resLabelUs: "🇺🇸 EE.UU. (US)",
            resLabelUk: "🇬🇧 Reino Unido (UK)",
            errorEmpty: "⚠️ Por favor ingresa una talla válida (mayor que 0).",
            errorLarge: "⚠️ Por favor ingresa una talla razonable (que no exceda 50).",
            noteText: "La talla ingresada no está en la tabla estándar. Se utilizó una estimación aproximada."
        }
    };

    let currentLang = 'en';

    function switchLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.getElementById('title').textContent = t.title;
        document.getElementById('subtitle').textContent = t.subtitle;
        document.getElementById('labelStandard').textContent = t.labelStandard;
        document.getElementById('optCn').textContent = t.optCn;
        document.getElementById('optEu').textContent = t.optEu;
        document.getElementById('optUs').textContent = t.optUs;
        document.getElementById('optUk').textContent = t.optUk;
        document.getElementById('labelInput').textContent = t.labelInput;
        document.getElementById('btnConvert').textContent = t.btnConvert;
        document.getElementById('resultTitle').textContent = t.resultTitle;
        document.getElementById('resLabelCn').textContent = t.resLabelCn;
        document.getElementById('resLabelEu').textContent = t.resLabelEu;
        document.getElementById('resLabelUs').textContent = t.resLabelUs;
        document.getElementById('resLabelUk').textContent = t.resLabelUk;
        document.getElementById('noteText').textContent = t.noteText;
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            switchLanguage(this.dataset.lang);
        });
    });

    function convertSize() {
        const system = document.getElementById('sizeSystem').value;
        const size = parseFloat(document.getElementById('inputSize').value);
        const resultDiv = document.getElementById('result');
        const noteDiv = document.getElementById('note');
        const t = translations[currentLang];

        resultDiv.classList.remove('error');
        noteDiv.classList.remove('show');

        if (isNaN(size) || size <= 0) {
            resultDiv.innerHTML = '<span style="color:red;">' + t.errorEmpty + '</span>';
            resultDiv.classList.add('show', 'error');
            return;
        }
        if (size > 50) {
            resultDiv.innerHTML = '<span style="color:red;">' + t.errorLarge + '</span>';
            resultDiv.classList.add('show', 'error');
            return;
        }

        const sizeChart = [
            [34, 34, 4, 2],
            [35, 35, 4.5, 2.5],
            [36, 36, 5, 3],
            [37, 37, 5.5, 3.5],
            [38, 38, 6.5, 4.5],
            [39, 39, 7, 5],
            [40, 40, 7.5, 5.5],
            [41, 41, 8, 6],
            [42, 42, 8.5, 6.5],
            [43, 43, 9, 7],
            [44, 44, 9.5, 7.5],
            [45, 45, 10, 8],
            [46, 46, 11, 9]
        ];

        let matchedRow = null;
        let exactMatch = false;
        for (let i = 0; i < sizeChart.length; i++) {
            const row = sizeChart[i];
            let idx = -1;
            if (system === 'cn') idx = 0;
            else if (system === 'eu') idx = 1;
            else if (system === 'us') idx = 2;
            else if (system === 'uk') idx = 3;
            if (row[idx] === size) {
                matchedRow = row;
                exactMatch = true;
                break;
            }
        }

        if (!exactMatch) {
            let estimated = [0, 0, 0, 0];
            if (system === 'cn') {
                estimated[0] = size;
                estimated[1] = Math.round(size);
                estimated[2] = Math.round(size * 0.625 - 17.5);
                estimated[3] = Math.round(size * 0.5625 - 19.125);
            } else if (system === 'eu') {
                estimated[0] = Math.round(size);
                estimated[1] = size;
                estimated[2] = Math.round(size * 0.65 - 21.05);
                estimated[3] = Math.round(size * 0.5875 - 22.575);
            } else if (system === 'us') {
                estimated[0] = Math.round((size + 28) / 0.875);
                estimated[1] = Math.round((size + 31) / 0.8125);
                estimated[2] = size;
                estimated[3] = Math.round(size * 0.925 - 0.075);
            } else if (system === 'uk') {
                estimated[0] = Math.round((size + 26) / 0.9375);
                estimated[1] = Math.round((size + 27) / 0.84375);
                estimated[2] = Math.round(size * 1.081 + 0.189);
                estimated[3] = size;
            }
            for (let j = 0; j < 4; j++) {
                if (estimated[j] < 0) estimated[j] = 'N/A';
            }
            matchedRow = estimated;
            noteDiv.classList.add('show');
        }

        document.getElementById('resCn').textContent = matchedRow[0];
        document.getElementById('resEu').textContent = matchedRow[1];
        document.getElementById('resUs').textContent = matchedRow[2];
        document.getElementById('resUk').textContent = matchedRow[3];

        resultDiv.classList.add('show');
        resultDiv.classList.remove('error');
    }

    document.getElementById('inputSize').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            convertSize();
        }
    });
</script>
</body>
</html>
